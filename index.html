
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YURTISH MUSIC</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0c12;color:white;font-family:Arial,sans-serif;padding:22px 16px 120px}
header{display:flex;justify-content:space-between;align-items:center}
.logo{font-size:22px;font-weight:900;letter-spacing:1px;color:#b59aff}
h1{font-size:34px;margin:35px 0 8px}
p{color:#999}
input{width:100%;padding:16px;border:1px solid #333548;border-radius:14px;background:#191b26;color:white;font-size:16px;margin:18px 0}
h2{font-size:20px;margin-top:30px}
button{border:0;cursor:pointer}
.tabs{display:flex;gap:9px;overflow:auto}
.tab{padding:10px 15px;border-radius:20px;background:#202231;color:#aaa;white-space:nowrap}
.tab.active{background:#a98aff;color:#171020}
#tracks{margin-top:20px}
.track{display:flex;align-items:center;gap:12px;padding:10px 0}
.cover{width:54px;height:54px;object-fit:cover;border-radius:10px;background:#29233b}
.info{flex:1;min-width:0}
.name{font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.artist{font-size:13px;color:#999;margin-top:5px}
.play,.fav{background:#28243a;color:white;border-radius:50%;width:40px;height:40px;font-size:18px}
.player{position:fixed;bottom:0;left:0;right:0;background:#171822;border-top:1px solid #333;padding:13px 17px calc(13px + env(safe-area-inset-bottom))}
.now{display:flex;align-items:center;gap:12px}
.now img{width:43px;height:43px;border-radius:8px;object-fit:cover}
.nowinfo{flex:1;min-width:0}
.controls{display:flex;align-items:center;gap:20px}
.controls button{background:none;color:white;font-size:22px}
#toggle{background:#a98aff;color:#171020;width:42px;height:42px;border-radius:50%}
#status{color:#999;font-size:13px;text-align:center;margin-top:15px}
</style>
</head>
<body>
<header>
<div class="logo">♫ YURTISH MUSIC</div>
<div>🎧</div>
</header>

<h1>Твоя музыка.</h1>
<p>Ищи. Слушай. Наслаждайся.</p>

<input id="search" placeholder="⌕  Поиск треков и исполнителей">

<div class="tabs">
<button class="tab active" data-mode="trending">Популярное</button>
<button class="tab" data-mode="search">Поиск</button>
<button class="tab" data-mode="favorites">Избранное ♥</button>
</div>

<h2 id="heading">Популярные треки</h2>
<div id="tracks">Загрузка музыки...</div>
<div id="status"></div>

<div class="player">
<div class="now">
<img id="currentCover" src="" alt="">
<div class="nowinfo">
<div class="name" id="currentTitle">Выбери трек</div>
<div class="artist" id="currentArtist">YURTISH MUSIC</div>
</div>
<div class="controls">
<button id="prev">◀</button>
<button id="toggle">▶</button>
<button id="next">▶</button>
</div>
</div>
</div>

<audio id="audio"></audio>

<script>
const tg=window.Telegram?.WebApp;
tg?.ready();
tg?.expand();

const API="https://discoveryprovider.audius.co/v1";
const APP="YurtishMusic";
const audio=document.getElementById("audio");
let songs=[],index=-1,mode="trending",timer;

const $=id=>document.getElementById(id);
const favorites=()=>JSON.parse(localStorage.getItem("ym_favorites")||"[]");

async function request(path){
 const r=await fetch(API+path);
 if(!r.ok)throw Error("Каталог временно недоступен");
 const j=await r.json();
 return j.data||[];
}

async function load(path,title){
 $("heading").textContent=title;
 $("tracks").textContent="Загружаем...";
 try{
  songs=await request(path);
  render();
  $("status").textContent=songs.length+" треков";
 }catch(e){
  $("tracks").textContent="Не удалось загрузить каталог. Попробуй позже.";
  $("status").textContent=e.message;
 }
}

function render(){
 let list=songs;
 if(mode==="favorites"){
  list=songs.filter(s=>favorites().includes(String(s.id)));
 }
 $("tracks").innerHTML="";
 if(!list.length){
  $("tracks").textContent="Здесь пока пусто.";
  return;
 }
 list.forEach(song=>{
  const i=songs.indexOf(song);
  const row=document.createElement("div");
  row.className="track";
  const img=document.createElement("img");
  img.className="cover";
  img.src=song.artwork?.["150x150"]||"";
  const info=document.createElement("div");
  info.className="info";
  const name=document.createElement("div");
  name.className="name";
  name.textContent=song.title;
  const artist=document.createElement("div");
  artist.className="artist";
  artist.textContent=song.user?.name||"Исполнитель";
  info.append(name,artist);
  const play=document.createElement("button");
  play.className="play";
  play.textContent="▶";
  play.onclick=()=>playSong(i);
  const fav=document.createElement("button");
  fav.className="fav";
  fav.textContent=favorites().includes(String(song.id))?"♥":"♡";
  fav.onclick=()=>{
   let f=favorites(),id=String(song.id);
   f=f.includes(id)?f.filter(x=>x!==id):[...f,id];
   localStorage.setItem("ym_favorites",JSON.stringify(f));
   render();
  };
  row.append(img,info,play,fav);
  $("tracks").append(row);
 });
}

async function playSong(i){
 if(i<0||i>=songs.length)return;
 index=i;
 const s=songs[i];
 $("currentTitle").textContent=s.title;
 $("currentArtist").textContent=s.user?.name||"Исполнитель";
 $("currentCover").src=s.artwork?.["150x150"]||"";
 audio.src=API+"/tracks/"+encodeURIComponent(s.id)+"/stream?app_name="+APP;
 try{
  await audio.play();
  $("toggle").textContent="Ⅱ";
 }catch(e){
  $("currentArtist").textContent="Этот трек недоступен для воспроизведения";
 }
}

$("toggle").onclick=()=>{
 if(!audio.src){
  if(songs.length)playSong(0);
 }else if(audio.paused){
  audio.play();$("toggle").textContent="Ⅱ";
 }else{
  audio.pause();$("toggle").textContent="▶";
 }
};

$("next").onclick=()=>playSong((index+1)%songs.length);
$("prev").onclick=()=>playSong((index-1+songs.length)%songs.length);
audio.onended=()=>playSong((index+1)%songs.length);

document.querySelectorAll(".tab").forEach(btn=>{
 btn.onclick=()=>{
  document.querySelectorAll(".tab").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");
  mode=btn.dataset.mode;
  if(mode==="trending")load("/tracks/trending?limit=30&app_name="+APP,"Популярные треки");
  if(mode==="favorites"){
   $("heading").textContent="Избранное";
   render();
  }
  if(mode==="search"){
   $("heading").textContent="Поиск музыки";
   $("tracks").textContent="Введи название песни выше.";
  }
 };
});

$("search").addEventListener("input",e=>{
 clearTimeout(timer);
 const q=e.target.value.trim();
 if(q.length<2)return;
 timer=setTimeout(()=>{
  mode="search";
  $("heading").textContent="Результаты поиска";
  load("/tracks/search?query="+encodeURIComponent(q)+"&limit=30&app_name="+APP,"Результаты поиска");
 },500);
});

load("/tracks/trending?limit=30&app_name="+APP,"Популярные треки");
</script>
</body>
</html>
